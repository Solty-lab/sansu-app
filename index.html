<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="練習帳">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>計算と単位の練習帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 方眼ノートの上で練習する: 紙・インク・黒板の緑・赤ペン・蛍光ペン */
:root {
  --paper: #f4f6f1;
  --sheet: #ffffff;
  --ink: #1e2937;
  --ink-2: #5b6573;
  --rule: #dde4dc;
  --board: #22614d;
  --board-soft: #e3efe9;
  --board-ink: #ffffff;
  --mark: #d1382b;
  --hl: #fff0a8;
  --warn: #9a6400;
  --f-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", system-ui, sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-mono: "BIZ UDGothic", "Osaka-Mono", ui-monospace, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111714; --sheet: #19211d; --ink: #e5ebe6; --ink-2: #a2aea7; --rule: #29342e;
    --board: #5bb393; --board-soft: #1f3129; --board-ink: #0c1310; --mark: #ff6f61; --hl: #4d4520; --warn: #e3b25c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111714; --sheet: #19211d; --ink: #e5ebe6; --ink-2: #a2aea7; --rule: #29342e;
  --board: #5bb393; --board-soft: #1f3129; --board-ink: #0c1310; --mark: #ff6f61; --hl: #4d4520; --warn: #e3b25c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--board); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.3; }

/* ヘッダー */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; display: flex; align-items: center; gap: 10px; }
.brand .sq { width: 28px; height: 28px; border-radius: 6px; background: var(--board); position: relative; }
.brand .sq::after { content: "÷"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--board-ink); font-size: 18px; }
.tabs { display: flex; gap: 4px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 999px; padding: 4px; }
.tabs button { border: 0; background: transparent; padding: 8px 16px; border-radius: 999px; font-size: .95rem; }
.tabs button[aria-pressed="true"] { background: var(--board); color: var(--board-ink); }

/* 方眼の地 */
.grid-bg {
  background-color: var(--sheet);
  background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 24px 24px;
}

/* ホーム */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; padding: 28px; border-radius: var(--r); border: 1px solid var(--rule); }
.hero h1 { font-size: clamp(1.6rem, 3.4vw, 2.3rem); }
.hero p { margin: 6px 0 0; color: var(--ink-2); }
.btn { border: 0; border-radius: 12px; padding: 14px 22px; font-weight: 700; font-family: var(--f-display); font-size: 1.1rem; }
.btn-main { background: var(--board); color: var(--board-ink); font-size: 1.3rem; padding: 18px 30px; }
.btn-sub { background: var(--board-soft); color: var(--ink); }
.btn-line { background: transparent; border: 2px solid var(--rule); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.tracks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.track { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 20px; display: grid; gap: 12px; align-content: start; }
.track h2 { font-size: 1.3rem; display: flex; gap: 10px; align-items: baseline; }
.track h2 small { font-family: var(--f-body); font-size: .85rem; color: var(--ink-2); font-weight: 400; }
.stage { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px dashed var(--rule); }
.code { font-family: var(--f-mono); font-weight: 700; font-size: .9rem; padding: 4px 8px; border-radius: 6px; background: var(--board-soft); color: var(--board); }
.stage.locked .code { background: transparent; color: var(--ink-2); border: 1px dashed var(--rule); }
.stage .nm { font-weight: 700; }
.stage .sub { font-size: .85rem; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--rule); }
.dots i.ok { background: var(--board); }
.dots i.ng { background: var(--mark); }
.stage .btn { padding: 10px 16px; font-size: .95rem; }
.note { font-size: .9rem; color: var(--ink-2); }

/* 練習 */
.practice { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.col { display: grid; gap: 14px; min-width: 0; }
.pbar { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.pbar .dots i { width: 14px; height: 14px; }
.pbar .dots i.now { outline: 2px solid var(--board); outline-offset: 2px; }
.pbar .count { font-family: var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.qcard { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 22px 24px; display: grid; gap: 16px; overflow: hidden; }
.qmeta { display: flex; gap: 8px; align-items: center; font-size: .85rem; color: var(--ink-2); flex-wrap: wrap; }
.q { font-size: clamp(1.5rem, 3vw, 2.1rem); line-height: 1.9; font-family: var(--f-body); font-weight: 700; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.q .box { display: inline-block; min-width: 1.4em; text-align: center; color: var(--board); font-weight: 700; }
.lead { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; }
.qnote { font-size: .9rem; color: var(--ink-2); }
.expr { font-size: 1.15em; margin-top: 4px; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.15; font-size: .8em; margin: 0 .12em; }
.fr .nu { border-bottom: 2px solid currentColor; padding: 0 .2em; }
.fr .de { padding: 0 .2em; }
.mx { white-space: nowrap; }
.slots { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.slotwrap { display: flex; align-items: center; gap: 8px; }
.slot { min-width: 6.5em; min-height: 3.3em; padding: 6px 14px; border-radius: 12px; border: 2px solid var(--rule); background: var(--paper); font-size: 1.6rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: flex-end; font-variant-numeric: tabular-nums; }
.slot[aria-pressed="true"] { border-color: var(--board); box-shadow: 0 0 0 3px var(--board-soft); }
.slot .ph { color: var(--ink-2); font-weight: 400; font-size: 1rem; }
.slot .cur { display: inline-block; width: 2px; height: 1.2em; background: var(--board); margin-left: 3px; animation: blink 1s steps(1) infinite; }
.unit { font-size: 1.3rem; font-weight: 700; }
@keyframes blink { 50% { opacity: 0; } }
.choices { display: flex; flex-wrap: wrap; gap: 12px; }
.choice { border: 2px solid var(--rule); background: var(--paper); border-radius: 12px; padding: 14px 20px; font-size: 1.35rem; font-weight: 700; min-width: 7em; }
.choice[aria-pressed="true"] { border-color: var(--board); background: var(--board-soft); }
.choice.right { border-color: var(--board); }
.choice.wrong { border-color: var(--mark); }
.keypad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.key { min-height: 64px; border-radius: 12px; border: 1px solid var(--rule); background: var(--sheet); font-size: 1.6rem; font-family: var(--f-mono); font-weight: 700; }
.key:active { background: var(--board-soft); }
.key.fn { font-family: var(--f-body); font-size: 1.05rem; color: var(--ink-2); }
.key.go { background: var(--board); color: var(--board-ink); border-color: var(--board); font-family: var(--f-display); font-size: 1.3rem; }
.feedback { display: grid; gap: 12px; padding: 18px 20px; border-radius: var(--r); border: 2px solid var(--rule); background: var(--sheet); }
.feedback.ok { border-color: var(--board); }
.feedback.ng { border-color: var(--mark); }
.feedback.warn { border-color: var(--warn); }
.fb-title { font-family: var(--f-display); font-weight: 700; font-size: 1.4rem; }
.feedback.ok .fb-title { color: var(--board); }
.feedback.ng .fb-title { color: var(--mark); }
.feedback.warn .fb-title { color: var(--warn); }
.fb-ans { font-size: 1.4rem; font-weight: 700; }
.fb-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.maru { position: absolute; right: 14px; top: 10px; width: 120px; height: 120px; pointer-events: none; }
.maru circle { fill: none; stroke: var(--mark); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 330; stroke-dashoffset: 330; animation: draw .45s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* 右側: メモ / しくみ */
.side { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: min(78vh, 760px); overflow: hidden; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.side-tabs { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--rule); align-items: center; flex-wrap: wrap; }
.side-tabs .t { border: 0; background: transparent; padding: 8px 14px; border-radius: 10px; font-weight: 700; }
.side-tabs .t[aria-pressed="true"] { background: var(--board-soft); color: var(--board); }
.side-tabs .sp { flex: 1; }
.side-tabs .mini { border: 1px solid var(--rule); background: var(--paper); border-radius: 10px; padding: 6px 12px; font-size: .9rem; }
.side-tabs .mini[aria-pressed="true"] { border-color: var(--board); color: var(--board); }
.memo { position: relative; min-height: 500px; touch-action: none; }
.memo canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.memo .hint { position: absolute; left: 14px; bottom: 10px; font-size: .85rem; color: var(--ink-2); pointer-events: none; }
.explain { padding: 20px; display: grid; gap: 16px; align-content: start; overflow: auto; }
.ex-step { font-size: 1.15rem; line-height: 1.9; }
.ex-step small { color: var(--ink-2); font-size: .92rem; }
.ex-nav { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ex-nav .count { font-family: var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ex-empty { color: var(--ink-2); }
.ex-scroll { overflow-x: auto; padding: 8px 0; }

/* 筆算 */
.hissan { display: inline-grid; font-family: var(--f-mono); font-size: 1.7rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.hs-row { display: grid; grid-template-columns: repeat(var(--cols), 1.15em); }
.hissan.is-div .hs-row { grid-template-columns: 3.2em repeat(var(--cols), 1.15em); }
.hs-row.small { font-size: .55em; color: var(--mark); grid-template-columns: repeat(var(--cols), 2.09em); }
.hissan.is-div .hs-row.small { grid-template-columns: 5.82em repeat(var(--cols), 2.09em); }
.hs-c, .hs-left { position: relative; height: 1.45em; display: grid; place-items: center; }
.hs-left { justify-items: end; padding-right: 2px; }
.hs-row.line .hs-c { border-bottom: 2px solid var(--ink); }
.hs-row.ovl .hs-c { border-top: 2px solid var(--ink); }
.hs-c.hl { background: var(--hl); border-radius: 4px; }
.hs-c.strike { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--mark); text-decoration-thickness: 2px; }
.hs-c .dot { position: absolute; right: -0.12em; bottom: .18em; width: .22em; height: .22em; border-radius: 50%; background: currentColor; }

/* 結果 */
.result { display: grid; gap: 20px; }
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score .big { font-family: var(--f-display); font-size: 3.4rem; font-weight: 700; color: var(--board); font-variant-numeric: tabular-nums; }
.list { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); }
.li { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--rule); align-items: center; }
.li:first-child { border-top: 0; }
.li .m { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; text-align: center; }
.li .m.ok { color: var(--mark); }
.li .m.ng { color: var(--ink-2); }
.li .qq { min-width: 0; overflow-wrap: anywhere; }
.li .aa { font-size: .9rem; color: var(--ink-2); text-align: right; }
.banner { padding: 14px 18px; border-radius: 12px; background: var(--board-soft); font-weight: 700; }

/* 保護者 */
.parent { display: grid; gap: 22px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.tile { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; }
.tile .k { font-size: .82rem; color: var(--ink-2); letter-spacing: .04em; }
.tile .v { font-family: var(--f-display); font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.sec { display: grid; gap: 10px; }
.sec h2 { font-size: 1.2rem; }
.tbl-wrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: 10px 14px; border-top: 1px solid var(--rule); white-space: nowrap; }
th { font-size: .8rem; color: var(--ink-2); font-weight: 700; letter-spacing: .04em; border-top: 0; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
.bar { display: inline-block; width: 80px; height: 8px; background: var(--rule); border-radius: 4px; overflow: hidden; vertical-align: middle; margin-right: 8px; }
.bar i { display: block; height: 100%; background: var(--board); }
.bar.low i { background: var(--mark); }
.pill { display: inline-block; font-size: .8rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--rule); }
.pill.on { background: var(--board-soft); color: var(--board); border-color: transparent; }
details.sess { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; }
details.sess + details.sess { margin-top: 8px; }
details.sess summary { padding: 12px 16px; cursor: pointer; display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
details.sess .li { font-size: .92rem; }
.store { font-size: .9rem; color: var(--ink-2); }
.danger { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn-danger { background: transparent; border: 2px solid var(--mark); color: var(--mark); }

@media (max-width: 900px) {
  .practice { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; min-height: 420px; }
  .memo { min-height: 380px; }
}
@media (max-width: 720px) {
  .tracks { grid-template-columns: minmax(0, 1fr); }
  .hero { grid-template-columns: minmax(0, 1fr); padding: 20px; }
  .qcard { padding: 18px; }
  .key { min-height: 56px; }
  .maru { width: 84px; height: 84px; }
}
@media (prefers-reduced-motion: reduce) {
  .maru circle { animation: none; stroke-dashoffset: 0; }
  .slot .cur { animation: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== 数の扱い (分数で厳密に計算する) =====
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; };
const lcm = (a, b) => a / gcd(a, b) * b;

class Fr {
  constructor(n, d = 1) {
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d);
    this.n = n / g; this.d = d / g;
  }
  static of(x) {
    if (x instanceof Fr) return x;
    return Fr.dec(String(x));
  }
  static dec(s) {
    const m = String(s).match(/^(\d+)(?:\.(\d+))?$/);
    if (!m) throw new Error('bad decimal ' + s);
    const f = m[2] || '';
    return new Fr(parseInt(m[1] + f, 10), 10 ** f.length);
  }
  add(o) { o = Fr.of(o); return new Fr(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { o = Fr.of(o); return new Fr(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { o = Fr.of(o); return new Fr(this.n * o.n, this.d * o.d); }
  div(o) { o = Fr.of(o); return new Fr(this.n * o.d, this.d * o.n); }
  eq(o) { o = Fr.of(o); return this.n === o.n && this.d === o.d; }
  cmp(o) { o = Fr.of(o); return this.n * o.d - o.n * this.d; }
  isInt() { return this.d === 1; }
  terminating() { let d = this.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5; return d === 1; }
  decPlaces() { if (!this.terminating()) return Infinity; let k = 0; while ((10 ** k) % this.d) k++; return k; }
  toDec() {
    if (!this.terminating()) return null;
    const k = this.decPlaces();
    return fmtScaled(this.n * (10 ** k / this.d), k);
  }
  val() { return this.n / this.d; }
}

function fmtScaled(num, k) {
  const neg = num < 0;
  let s = String(Math.abs(num));
  if (k === 0) return (neg ? '-' : '') + s;
  s = s.padStart(k + 1, '0');
  const ip = s.slice(0, -k), fp = s.slice(-k).replace(/0+$/, '');
  return (neg ? '-' : '') + (fp ? ip + '.' + fp : ip);
}

// ===== 乱数 =====
let rnd = Math.random;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ===== 表示用 HTML =====
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fracHTML(n, d) { return `<span class="fr"><span class="nu">${n}</span><span class="de">${d}</span></span>`; }
// 分数を 帯分数/仮分数 で表示
function frHTML(f, mixed = true) {
  if (f.isInt()) return String(f.n);
  if (mixed && f.n > f.d) { const w = Math.floor(f.n / f.d); return `<span class="mx">${w}${fracHTML(f.n - w * f.d, f.d)}</span>`; }
  return fracHTML(f.n, f.d);
}
function frText(f, mixed = true) {
  if (f.isInt()) return String(f.n);
  if (mixed && f.n > f.d) { const w = Math.floor(f.n / f.d); return `${w}と${f.n - w * f.d}/${f.d}`; }
  return `${f.n}/${f.d}`;
}
// 数(表示形式つき)  kind: 'dec' | 'frac' | 'int'
const num = (v, kind) => ({ k: 'num', v: Fr.of(v), kind: kind || (Fr.of(v).isInt() ? 'int' : 'dec'), src: typeof v === 'string' ? v : null });
function numHTML(t) {
  if (t.kind === 'frac') return frHTML(t.v, true);
  if (t.src) return t.src;
  return t.v.isInt() ? String(t.v.n) : (t.v.toDec() || frHTML(t.v));
}
function numText(t) {
  if (t.kind === 'frac') return frText(t.v, true);
  if (t.src) return t.src;
  return t.v.isInt() ? String(t.v.n) : (t.v.toDec() || frText(t.v));
}
// 答えの見せ方
function ansHTML(f, prefer) {
  if (prefer === 'frac' || !f.terminating()) return frHTML(f, true);
  return f.toDec();
}
function ansText(f, prefer) {
  if (prefer === 'frac' || !f.terminating()) return frText(f, true);
  return f.toDec();
}

// ===== 入力の読み取り =====
// 戻り値: {ok:true, v:Fr, form:'dec'|'frac'|'mixed', reduced:bool} か {ok:false}
function parseAnswer(s) {
  s = String(s || '').trim();
  let m;
  if ((m = s.match(/^(\d+)(?:\.(\d+))?$/))) return { ok: true, v: Fr.dec(s), form: 'dec', reduced: true };
  if ((m = s.match(/^(\d+)\/(\d+)$/))) {
    const n = +m[1], d = +m[2]; if (d === 0) return { ok: false };
    return { ok: true, v: new Fr(n, d), form: 'frac', reduced: gcd(n, d) === 1 && d !== 1 };
  }
  if ((m = s.match(/^(\d+)と(\d+)\/(\d+)$/))) {
    const w = +m[1], n = +m[2], d = +m[3]; if (d === 0) return { ok: false };
    return { ok: true, v: new Fr(w * d + n, d), form: 'mixed', reduced: gcd(n, d) === 1 && n < d && n > 0 };
  }
  return { ok: false };
}
// 判定: 'ok' | 'reduce' | 'ng' | 'empty' | 'bad'
function judgeSlot(input, slot) {
  if (!String(input || '').trim()) return 'empty';
  const p = parseAnswer(input);
  if (!p.ok) return 'bad';
  if (!p.v.eq(slot.value)) return 'ng';
  if (!p.reduced) return 'reduce';
  return 'ok';
}

// ===== 筆算グリッド =====
// row: {cells:[{c,dot,hl,small}], left:'', line:bool, top:bool}
function blankRow(n) { return { cells: Array.from({ length: n }, () => ({ c: '' })), left: '', line: false, top: false }; }
function cloneRows(rows) { return rows.map((r) => ({ ...r, cells: r.cells.map((c) => ({ ...c })) })); }
// 数字列 digits を、右端が列 endCol に来るように置く
function putDigits(row, digits, endCol, opts = {}) {
  const ds = String(digits).split('');
  for (let k = 0; k < ds.length; k++) {
    const col = endCol - (ds.length - 1 - k);
    if (col >= 0 && col < row.cells.length) row.cells[col] = { c: ds[k], hl: !!opts.hl };
  }
}
function clearHL(rows) { rows.forEach((r) => r.cells.forEach((c) => { c.hl = false; })); }
function gridHTML(rows, opts = {}) {
  const n = rows[0].cells.length;
  const hasLeft = rows.some((r) => r.left);
  let h = `<div class="hissan${opts.div ? ' is-div' : ''}" style="--cols:${n}">`;
  for (const r of rows) {
    h += `<div class="hs-row${r.line ? ' line' : ''}${r.top ? ' ovl' : ''}${r.small ? ' small' : ''}">`;
    if (hasLeft) h += `<span class="hs-left">${esc(r.left || '')}</span>`;
    for (const c of r.cells) {
      h += `<span class="hs-c${c.hl ? ' hl' : ''}${c.strike ? ' strike' : ''}">${esc(c.c || '')}${c.dot ? '<i class="dot"></i>' : ''}</span>`;
    }
    h += '</div>';
  }
  return h + '</div>';
}

// 数を「整数部の桁」「小数部の桁」に分ける
function splitDec(s) { const [ip, fp = ''] = String(s).split('.'); return { ip, fp, digits: (ip + fp).replace(/^0+(?=\d)/, ''), places: fp.length }; }

// --- たし算・ひき算 (小数点をそろえる) ---
function addSubFrames(aS, bS, op) {
  const A = splitDec(aS), B = splitDec(bS);
  const F = Math.max(A.fp.length, B.fp.length);
  const I = Math.max(A.ip.length, B.ip.length) + 1;
  const n = I + F + 1; // 左端に記号用の列
  const colOf = (posFromPoint) => I + posFromPoint; // posFromPoint: 整数部最後の桁=0, 小数第1位=1...
  const rowFor = (S) => {
    const r = blankRow(n);
    const ip = S.ip.split(''), fp = S.fp.split('');
    ip.forEach((c, i) => { r.cells[colOf(i - ip.length + 1)] = { c }; });
    fp.forEach((c, i) => { r.cells[colOf(i + 1)] = { c }; });
    if (S.fp.length) r.cells[colOf(0)].dot = true;
    return r;
  };
  const carry = blankRow(n); carry.small = true;
  const ra = rowFor(A), rb = rowFor(B); rb.cells[0] = { c: op === '+' ? '+' : '−' }; rb.line = true;
  const res = blankRow(n);
  const rows = [carry, ra, rb, res];
  const frames = [];
  const placeName = (p) => (p > 0 ? ['', '1/10の位', '1/100の位', '1/1000の位'][p] : ['一の位', '十の位', '百の位', '千の位', '万の位'][-p]);
  frames.push({ grid: cloneRows(rows), text: F ? `小数点の位置をたてにそろえて書きます。${A.fp.length !== B.fp.length ? '小数点より右の桁数がちがうところは 0 があると考えます。' : ''}` : '位をたてにそろえて書きます。' });
  // 桁ごとの値
  const digitAt = (S, p) => { // p: 小数第p位(p>0) / 10^(-p) の位 (p<=0)
    if (p > 0) return +(S.fp[p - 1] || 0);
    const i = S.ip.length - 1 + p; return i >= 0 ? +(S.ip[i] || 0) : 0;
  };
  let c = 0;
  const top = { ...A }; // ひき算でかりた後の値
  const topDigits = {};
  for (let p = F; p > -(I - 1); p--) topDigits[p] = digitAt(A, p);
  const lastP = -(I - 2);
  const out = {};
  for (let p = F; p >= lastP; p--) {
    const da = topDigits[p], db = digitAt(B, p);
    let text;
    if (op === '+') {
      const s = da + db + c;
      out[p] = s % 10;
      text = `${placeName(p)}: ${da} + ${db}${c ? ' + くり上がり 1' : ''} = ${s}${s >= 10 ? `。${s % 10} を書いて、1 を次の位へくり上げます` : ''}`;
      const nc = s >= 10 ? 1 : 0;
      if (nc && p > lastP) carry.cells[colOf(p - 1)] = { c: '1' };
      c = nc;
    } else {
      let x = da;
      if (x < db) {
        // 上の位からかりる (0 が続く場合は順にかりる)
        let q = p - 1;
        while (topDigits[q] === 0) { topDigits[q] = 9; carry.cells[colOf(q)] = { c: '9' }; ra.cells[colOf(q)].strike = true; q--; }
        topDigits[q] -= 1; carry.cells[colOf(q)] = { c: String(topDigits[q]) }; ra.cells[colOf(q)].strike = true;
        x += 10;
        text = `${placeName(p)}: ${da} − ${db} はひけないので、上の位から 1 かりて ${x} − ${db} = ${x - db}`;
      } else {
        text = `${placeName(p)}: ${x} − ${db} = ${x - db}`;
      }
      out[p] = x - db;
    }
    // 結果を書く
    clearHL(rows);
    const col = colOf(p);
    if (out[p] !== null) res.cells[col] = { c: String(out[p]), hl: true, dot: p === 0 && F > 0 };
    frames.push({ grid: cloneRows(rows), text });
  }
  if (op === '+' && c) {
    clearHL(rows);
    res.cells[colOf(lastP - 1)] = { c: '1', hl: true };
    frames.push({ grid: cloneRows(rows), text: 'いちばん上のくり上がり 1 をそのまま書きます。' });
  }
  // 上の位の 0 を消す (ひき算で 0 が先頭に来るとき)
  for (let k = 1; k < n; k++) {
    const cell = res.cells[k];
    if (k >= colOf(0)) break;
    if (cell.c === '0') { cell.c = ''; } else if (cell.c) break;
  }
  const av = Fr.dec(aS), bv = Fr.dec(bS);
  const result = op === '+' ? av.add(bv) : av.sub(bv);
  if (F && res.cells[colOf(F)].c === '0') {
    clearHL(rows);
    for (let p = F; p >= 1; p--) {
      const cell = res.cells[colOf(p)];
      if (cell.c === '0') cell.strike = true; else break;
    }
    frames.push({ grid: cloneRows(rows), text: `小数点より右の、終わりの 0 は消します。答えは ${result.toDec()} です。` });
  } else {
    frames.push({ grid: cloneRows(rows), text: `答えは ${result.toDec()} です。` });
  }
  return frames;
}

// --- かけ算 (右にそろえる。小数点はあとでうつ) ---
function mulFrames(aS, bS) {
  const A = splitDec(aS), B = splitDec(bS);
  const ai = +A.digits, bi = +B.digits;
  const places = A.places + B.places;
  const prod = ai * bi;
  const bd = String(bi).split('').reverse(); // 一の位から
  const partials = bd.map((d, i) => ({ d: +d, v: ai * +d, shift: i }));
  let prodS = String(prod);
  if (places) prodS = prodS.padStart(places + 1, '0');
  const width = Math.max((A.ip + A.fp).length, (B.ip + B.fp).length + 1, ...partials.map((p) => String(p.v).length + p.shift), prodS.length) + 1;
  const n = width;
  const end = n - 1;
  const ra = blankRow(n); putDigits(ra, A.ip + A.fp === '' ? String(ai) : (A.ip + A.fp).replace(/^0+(?=\d\d)/, ''), end);
  if (A.places) ra.cells[end - A.places].dot = true;
  const bDisp = (B.ip + B.fp).replace(/^0+(?=\d\d)/, '');
  const rb = blankRow(n); putDigits(rb, bDisp, end); rb.cells[end - bDisp.length] = { c: '×' };
  if (B.places) rb.cells[end - B.places].dot = true;
  rb.line = true;
  const rows = [ra, rb];
  const frames = [];
  const aTxt = A.places ? `${aS} は ${ai} の ${['', '1/10', '1/100', '1/1000'][A.places]}` : '';
  const bTxt = B.places ? `${bS} は ${bi} の ${['', '1/10', '1/100', '1/1000'][B.places]}` : '';
  frames.push({ grid: cloneRows(rows), text: places ? `小数点は気にせず、右の端をそろえて書きます。まず ${ai} × ${bi} を整数のかけ算として計算します。` : '右の端をそろえて書きます。' });
  const pRows = [];
  partials.forEach((p, i) => {
    const r = blankRow(n);
    if (p.v === 0) return;
    putDigits(r, String(p.v), end - p.shift, { hl: true });
    clearHL(rows);
    rows.push(r); pRows.push(r);
    const posName = ['一の位', '十の位', '百の位'][i];
    frames.push({ grid: cloneRows(rows), text: `かける数の${posName}の ${p.d} をかけます: ${ai} × ${p.d} = ${p.v}${i ? `。${posName}なので、${i}つ左にずらして書きます` : ''}` });
  });
  if (pRows.length > 1) {
    pRows[pRows.length - 1].line = true;
    const r = blankRow(n); putDigits(r, prodS.replace(/^0+(?=\d)/, ''), end, { hl: true });
    clearHL(rows);
    rows.push(r);
    frames.push({ grid: cloneRows(rows), text: `たてにたし算します: ${ai} × ${bi} = ${prod}` });
  }
  const last = rows[rows.length - 1];
  if (places) {
    // 必要なら 0 を補う
    clearHL(rows);
    putDigits(last, prodS, end);
    last.cells[end - places].dot = true;
    last.cells[end - places].hl = true;
    const res = Fr.dec(aS).mul(Fr.dec(bS));
    let text = `${[aTxt, bTxt].filter(Boolean).join('、')}。だから答えは ${prod} の 1/${10 ** places} です。小数点より右の桁数は ${A.places} + ${B.places} = ${places} けたなので、右から ${places} けたのところに小数点をうちます。`;
    if (prodS.length > String(prod).length) text += ' 桁が足りないところには 0 を書きます。';
    frames.push({ grid: cloneRows(rows), text });
    const shown = fmtScaled(prod, places) ;
    const raw = prodS.slice(0, -places) + '.' + prodS.slice(-places);
    if (raw !== shown) {
      clearHL(rows);
      for (let k = 0; k < places; k++) { const cell = last.cells[end - k]; if (cell.c === '0') cell.strike = true; else break; }
      frames.push({ grid: cloneRows(rows), text: `小数点より右の、終わりの 0 は消します。答えは ${res.toDec()} です。` });
    } else {
      frames.push({ grid: cloneRows(rows), text: `答えは ${res.toDec()} です。` });
    }
  } else {
    frames.push({ grid: cloneRows(rows), text: `答えは ${prod} です。` });
  }
  return frames;
}

// --- わり算 (わる数を整数にしてから) ---
// dividendS: 10倍などをしたあとの わられる数(文字列), divisor: 整数
function longDivFrames(dividendS, divisor, introFrames = []) {
  const D = splitDec(dividendS);
  let digits = (D.ip + D.fp).split('').map(Number);
  // 先頭の 0 (0.48 など) は残す: 位置を保つため
  const intLen = D.ip.length;
  let hasDot = D.fp.length > 0;
  const steps = [];
  let r = 0, started = false;
  for (let i = 0; ; i++) {
    if (i >= digits.length) {
      if (r === 0 && i > intLen - 1) break;
      digits.push(0); hasDot = true;
    }
    const cur = r * 10 + digits[i];
    const q = Math.floor(cur / divisor);
    if (!started && q === 0 && i < intLen - 1) { r = cur; steps.push({ i, skip: true, cur }); continue; }
    started = true;
    const prod = q * divisor;
    steps.push({ i, cur, q, prod, r: cur - prod });
    r = cur - prod;
    if (r === 0 && i >= digits.length - 1 && i >= intLen - 1) break;
    if (steps.length > 40) break;
  }
  const n = digits.length;
  const qRow = blankRow(n);
  const dRow = blankRow(n); dRow.top = true; dRow.left = `${divisor})`;
  digits.forEach((d, i) => { dRow.cells[i] = { c: String(d) }; });
  // 追加した 0 は薄く
  for (let i = (D.ip + D.fp).length; i < n; i++) dRow.cells[i].added = true;
  if (hasDot) dRow.cells[intLen - 1].dot = true;
  const rows = [qRow, dRow];
  const frames = introFrames.slice();
  frames.push({ grid: cloneRows(rows), text: `${dividendS} ÷ ${divisor} を筆算で計算します。${(D.ip + D.fp).length < n ? '割り切れるまで、わられる数の後ろに 0 をつけたして続けます。' : ''}`, div: true });
  if (hasDot) {
    qRow.cells[intLen - 1].dot = true;
    frames.push({ grid: cloneRows(rows), text: '商の小数点は、わられる数の小数点の真上にうっておきます。', div: true });
  }
  const real = steps.filter((s) => !s.skip);
  const setQ = (s, hl) => { qRow.cells[s.i] = { c: String(s.q), hl, dot: hasDot && s.i === intLen - 1 }; };
  const firstPos = real.findIndex((x) => x.q > 0);
  // 最初の 0 (0.4 の 0 など)
  real.slice(0, firstPos).forEach((s) => {
    clearHL(rows); setQ(s, true);
    frames.push({ grid: cloneRows(rows), text: `${s.cur} の中に ${divisor} は入らないので、商に 0 を立てて次の数字をおろします。`, div: true });
  });
  for (let k = firstPos; k < real.length; k++) {
    const s = real[k];
    if (s.q === 0) continue;
    clearHL(rows); setQ(s, true);
    const pr = blankRow(n); putDigits(pr, String(s.prod), s.i, { hl: true }); pr.line = true;
    rows.push(pr);
    frames.push({ grid: cloneRows(rows), text: `${s.cur} ÷ ${divisor} → 商に ${s.q} を立てます。${divisor} × ${s.q} = ${s.prod} を下に書きます。`, div: true });
    let j = k + 1; const zeros = [];
    while (j < real.length && real[j].q === 0) { zeros.push(real[j]); j++; }
    const next = real[j];
    clearHL(rows);
    const rr = blankRow(n);
    if (next) {
      putDigits(rr, String(next.cur), next.i, { hl: true });
      zeros.forEach((z) => setQ(z, true));
      rows.push(rr);
      const zt = zeros.length ? `数字を1つおろしても ${divisor} は入らないので、商に 0 を立てて、もう1つおろします。` : '';
      frames.push({ grid: cloneRows(rows), text: `${s.cur} − ${s.prod} = ${s.r}。次の数字をおろします。${zt}→ ${next.cur}`, div: true });
    } else {
      putDigits(rr, String(s.r), s.i, { hl: true });
      zeros.forEach((z) => setQ(z, true));
      rows.push(rr);
      const zt = zeros.length ? `残りの ${'0'.repeat(zeros.length)} をおろしても ${divisor} は入らないので、商に 0 を立てます。` : 'あまりが 0 になったので、わり切れました。';
      frames.push({ grid: cloneRows(rows), text: `${s.cur} − ${s.prod} = ${s.r}。${zt}`, div: true });
    }
  }
  // 商の先頭の 0 (0.4 など)
  return frames;
}

function divFrames(aS, bS) {
  // aS ÷ bS (どちらも 10進の文字列)
  const B = splitDec(bS);
  const k = B.places;
  const intro = [];
  let dividendS = aS;
  if (k) {
    const scaled = Fr.dec(aS).mul(10 ** k);
    dividendS = scaled.toDec();
    intro.push({ text: `わる数 ${bS} を整数にするため、わる数とわられる数の両方を ${10 ** k} 倍します (小数点を右に ${k} つ動かす)。<br>${aS} ÷ ${bS} = ${dividendS} ÷ ${+B.digits}<br>両方を同じ数だけ倍しても、商は変わりません。` });
  }
  const divisor = +B.digits;
  // わられる数の先頭が "0." のときは 0 を残す
  return longDivFrames(dividendS, divisor, intro);
}

// ===== 問題の種類 =====
// 各問題: {type, stage, html, text, slots:[{value:Fr, unit, prefer}], choices?, answerChoice?, explain: ()=>frames}
const STAGES = {
  A1: { track: 'A', name: '整数・小数の計算', types: ['dec_add', 'dec_sub', 'int_mul', 'dec_mul', 'int_div', 'dec_div', 'mental'] },
  A2: { track: 'A', name: '分数の計算', types: ['fr_add', 'fr_sub', 'fr_mul', 'fr_div'] },
  A3: { track: 'A', name: 'まぜた計算', types: ['mix_calc', 'mix_calc', 'order'] },
  B1: { track: 'B', name: '単位のかんさん', types: ['conv'] },
  B2: { track: 'B', name: '単位の組み合わせ', types: ['time_mix', 'len_mix', 'speed_conv'] },
  B3: { track: 'B', name: '速さ', types: ['speed'] },
  B4: { track: 'B', name: '単位量あたり', types: ['per_unit', 'per_total', 'compare'] },
};
const TRACKS = { A: { name: '計算のしくみ', stages: ['A1', 'A2', 'A3'] }, B: { name: '単位と速さ', stages: ['B1', 'B2', 'B3', 'B4'] } };
const TYPE_NAMES = {
  dec_add: '小数のたし算', dec_sub: '小数のひき算', int_mul: '整数のかけ算', dec_mul: '小数のかけ算', int_div: '整数のわり算', dec_div: '小数のわり算', mental: '暗算のくふう',
  fr_add: '分数のたし算', fr_sub: '分数のひき算', fr_mul: '分数のかけ算', fr_div: '分数のわり算',
  mix_calc: 'まぜた計算', order: '計算の順番',
  conv: '単位のかんさん', time_mix: '時間の組み合わせ', len_mix: '長さ・重さの組み合わせ', speed_conv: '速さの単位',
  speed: '速さの問題', per_unit: '1あたりを求める', per_total: '1あたりから求める', compare: 'くらべる',
};
const stageOfType = (t) => Object.keys(STAGES).find((s) => STAGES[s].types.includes(t));

const OPS = { '+': '+', '-': '−', '*': '×', '/': '÷' };
const slot = (value, unit = '', prefer) => ({ value: Fr.of(value), unit, prefer });
const textFrames = (...ts) => ts.map((t) => ({ text: t }));

// --- A1 ---
function decStr(intDigitsMax, places) {
  const max = 10 ** (intDigitsMax + places) - 1;
  let v;
  do { v = ri(10 ** places + 1, max); } while (v % 10 === 0 && places > 0);
  return fmtScaled(v, places);
}
const GEN = {};
GEN.dec_add = () => {
  const p1 = ri(1, 2), p2 = p1 === 1 ? 2 : pick([1, 2]);
  const a = decStr(2, p1), b = decStr(pick([1, 2]), p2);
  const v = Fr.dec(a).add(Fr.dec(b));
  return { html: `${a} + ${b} =`, text: `${a} + ${b}`, slots: [slot(v)], explain: () => addSubFrames(a, b, '+') };
};
GEN.dec_sub = () => {
  let a, b;
  do { a = decStr(2, ri(1, 2)); b = decStr(pick([1, 2]), ri(1, 2)); } while (Fr.dec(a).cmp(Fr.dec(b)) <= 0 || splitDec(a).fp.length === splitDec(b).fp.length && rnd() < 0.5);
  const v = Fr.dec(a).sub(Fr.dec(b));
  return { html: `${a} − ${b} =`, text: `${a} − ${b}`, slots: [slot(v)], explain: () => addSubFrames(a, b, '-') };
};
const noZeroInt = (lo, hi) => { let v; do { v = ri(lo, hi); } while (/0/.test(String(v))); return v; };
GEN.int_mul = () => {
  const a = ri(102, 987), b = noZeroInt(12, 89);
  return { html: `${a} × ${b} =`, text: `${a} × ${b}`, slots: [slot(a * b)], explain: () => mulFrames(String(a), String(b)) };
};
GEN.dec_mul = () => {
  const a = pick([fmtScaled(ri(11, 99), 1), fmtScaled(ri(101, 999), 2), fmtScaled(ri(11, 99), 1)]);
  const b = pick([fmtScaled(noZeroInt(11, 99), 1), fmtScaled(ri(2, 9), 1), String(ri(3, 9)), fmtScaled(noZeroInt(11, 99), 1)]);
  if (!/\./.test(a) && !/\./.test(b)) return GEN.dec_mul();
  const v = Fr.dec(a).mul(Fr.dec(b));
  return { html: `${a} × ${b} =`, text: `${a} × ${b}`, slots: [slot(v)], explain: () => mulFrames(a, b) };
};
GEN.int_div = () => {
  const d = ri(12, 48), q = ri(12, 99) * (rnd() < 0.3 ? 10 : 1) + (rnd() < 0.3 ? 0 : 0);
  const a = d * q;
  return { html: `${a} ÷ ${d} =`, text: `${a} ÷ ${d}`, slots: [slot(q)], explain: () => divFrames(String(a), String(d)) };
};
GEN.dec_div = () => {
  const form = ri(0, 2);

<script>

  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'tab') { if (view === 'practice' && sess && sess.phase) { finishSession(true); } view = v; confirmReset = false; copyState = null; render(); window.scrollTo(0, 0); }
  else if (a === 'start') { startSession(v); window.scrollTo(0, 0); }
  else if (a === 'key') typeKey(v);
  else if (a === 'slot') { if (sess.phase === 'answer') { sess.active = +v; render(); } }
  else if (a === 'choose') { sess.choice = v; sess.msg = null; render(); }
  else if (a === 'submit') submit();
  else if (a === 'next') { nextProblem(); window.scrollTo(0, 0); }
  else if (a === 'more') { oneMore(); window.scrollTo(0, 0); }
  else if (a === 'explain') showExplain();
  else if (a === 'side') { if (v === 'explain') showExplain(); else { sess.sideTab = 'memo'; render(); } }
  else if (a === 'fprev') { sess.frame = Math.max(0, sess.frame - 1); render(); }
  else if (a === 'fnext') { sess.frame = Math.min(frames().length - 1, sess.frame + 1); if (sess.phase === 'done') { const ts = state.typeStats[sess.problem.type]; if (ts && !sess.reviewed) { ts.review++; sess.reviewed = true; saveLocal(); } } render(); }
  else if (a === 'clear') { if (memo) memo.clear(); }
  else if (a === 'finger') { state.finger = !state.finger; saveLocal(); render(); }
  else if (a === 'quit') finishSession(true);
  else if (a === 'toggle') { state.unlocked[v] = !state.unlocked[v]; state.updatedAt = Date.now(); saveLocal(); saveRemote(); render(); }
  else if (a === 'copy') {
    const txt = exportText();
    const manual = () => { copyState = 'manual'; render(); const t = document.getElementById('export-box'); if (t) { t.focus(); t.select(); } };
    try { navigator.clipboard.writeText(txt).then(() => { copyState = 'ok'; render(); }, manual); } catch (err) { manual(); }
  }
  else if (a === 'reset') { confirmReset = true; render(); }
  else if (a === 'reset-no') { confirmReset = false; render(); }
  else if (a === 'reset-yes') { const keep = state.sessions; const f = state.finger; state = freshState(); state.sessions = keep; state.finger = f; state.updatedAt = Date.now(); saveLocal(); saveRemote(); confirmReset = false; render(); }
});
document.addEventListener('keydown', (e) => {
  if (view !== 'practice' || !sess) return;
  if (e.key === 'Enter' && e.target.closest && e.target.closest('button')) return;
  if (sess.phase === 'done' && e.key === 'Enter') { nextProblem(); return; }
  if (e.key === 'Enter') { submit(); e.preventDefault(); return; }
  if (e.key === 'Backspace') { typeKey('⌫'); e.preventDefault(); return; }
  if (/^[0-9./]$/.test(e.key)) { typeKey(e.key); return; }
  if (e.key === 'Tab' && sess.problem.slots.length > 1 && sess.phase === 'answer') { sess.active = (sess.active + 1) % sess.problem.slots.length; render(); e.preventDefault(); }
});

render();
initDb();
</script>
</body>
</html>
